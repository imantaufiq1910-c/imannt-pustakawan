<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Perpustakaan Klasik</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; color: #4A3525; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-md p-8 bg-[#F4EFE6] border-2 border-[#D4C5B9] rounded-2xl shadow-xl">
        <div class="text-center mb-6">
            <span class="text-3xl">📚</span>
            <h1 class="text-3xl font-bold mt-2 text-[#4A3525]">Perpustakaan Pustaka</h1>
            <p class="text-sm text-[#7A624E] mt-1">Silakan masuk untuk menjelajahi buku.</p>
        </div>

        {% if error %}
            <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded-lg text-center">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-2 bg-[#FDFBF7] border border-[#D4C5B9] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8B5A2B]">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 bg-[#FDFBF7] border border-[#D4C5B9] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8B5A2B]">
            </div>
            <button type="submit"
                class="w-full py-2.5 bg-[#8B5A2B] hover:bg-[#6E4621] text-white font-semibold rounded-lg shadow transition duration-200">
                Masuk
            </button>
        </form>

        <div class="mt-6 p-4 bg-[#EFE8DC] rounded-lg text-xs text-[#7A624E] space-y-1">
            <p class="font-bold">Akun Percobaan:</p>
            <p>• Pustakawan: <code class="bg-[#E4DACB] px-1 py-0.5 rounded">admin</code> / <code class="bg-[#E4DACB] px-1 py-0.5 rounded">123</code></p>
            <p>• Peminjam: <code class="bg-[#E4DACB] px-1 py-0.5 rounded">peminjam</code> / <code class="bg-[#E4DACB] px-1 py-0.5 rounded">123</code></p>
        </div>
    </div>

</body>
</html>
